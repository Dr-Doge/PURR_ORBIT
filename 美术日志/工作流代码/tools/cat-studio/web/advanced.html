<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrameStudio · 动画资产工作台</title><link rel="stylesheet" href="/style.css?v=frame-count-v2"></head>
<body>
<header class="topbar"><a class="brand" href="/" aria-label="FrameStudio 首页"><span class="brand-mark">✦</span><b>FrameStudio</b><span class="beta">STUDIO</span></a><div class="breadcrumbs">工作空间 <span>/</span> <b id="projectTitle">动画资产工作台</b></div><div class="header-actions"><span class="local-pill"><i></i> 本地工作空间</span><button id="developerLogBtn" class="icon-label">开发者日志</button><button id="settingsBtn" class="icon-label">⚙ <span>连接设置</span></button><button id="exportTop" class="primary">导出素材 ↗</button></div></header>
<div class="app-shell">
<aside class="library"><div class="workspace-name"><span class="workspace-icon">P</span><div><strong>我的资产工作室</strong><small>从灵感到游戏资产</small></div></div>
<nav><button class="nav-item active" data-view="canvas"><span>⌘</span> 创作画布 <small>01</small></button><button class="nav-item" data-view="queue"><span>◷</span> 任务队列 <small id="queueCount">0</small></button><button class="nav-item" data-view="exports"><span>▦</span> 导出资源 <small id="exportCount">0</small></button></nav>
<div class="section-label">素材项目 <div class="project-tools"><details class="sample-menu"><summary>示例 ▾</summary><div class="sample-options"><button data-command="demo" data-demo-kind="golden">招财猫动画示例</button><button data-command="demo" data-demo-kind="giant">巨型猫动画示例</button><button data-command="demo" data-demo-kind="batch">批量化尝试</button><button data-command="demo" data-demo-kind="calico-nine">三花猫 · 三向九动作范例</button><small>含透明帧与 Sprite Sheet，无需生成</small></div></details><button id="newProject" aria-label="新建素材项目">＋</button></div></div><div id="projects" class="projects"></div>
<div class="library-footer"><div class="connection"><i id="arkDot"></i><span>Seedance Mini</span><small id="arkStatus">检查中</small></div><div class="connection"><i id="gptDot"></i><span>GPT Image 2</span><small id="gptStatus">检查中</small></div><p>素材自动保存在这台电脑</p></div></aside>
<main>
<div class="canvas-toolbar"><div><div class="canvas-name-row"><h1 id="canvasTitle" title="双击改名">创作画布</h1><button id="renameCanvas" class="small-btn" aria-label="修改画布名称">✎ 改名</button></div><span id="canvasSubtitle">连接每一步，让灵感动起来。</span></div><div class="toolbar-actions"><button id="addImage">＋ Image</button><button id="importSheet">改造精灵图</button><button id="addAction">＋ 动作</button><button id="batchProcess">批量透明处理</button><button id="batchGenerate" class="primary">▷ 批量生成</button></div></div>
<div id="canvasView" class="view canvas-view"><div class="stage-hint">左键 / 中键拖动画布 · Shift+拖动框选 · Ctrl+C / V 复制粘贴</div><div id="viewport" tabindex="0"><div id="world"><svg id="edges" width="2600" height="4200" aria-hidden="true"></svg><div id="nodes"></div></div></div><div class="canvas-controls"><button id="zoomOut" aria-label="缩小画布">−</button><span id="zoomLabel">70%</span><button id="zoomIn" aria-label="放大画布">＋</button><i></i><button id="fitCanvas">适应画布</button></div><div class="flow-legend"><span>●</span> Image <i>→</i> 视频生成 <i>→</i> 透明处理 <i>→</i> 游戏资产</div></div>
<div id="queueView" class="view hidden scroll-view"></div><div id="exportsView" class="view hidden scroll-view"></div>
<div class="bottom-bar"><span id="saveStatus">● 已保存到本机</span><span>PNG + JSON + Godot SpriteFrames <i>·</i> 像素艺术工作流</span></div>
</main>
<aside class="inspector"><div class="inspector-title"><span>节点设置</span><span>☷</span></div><div id="inspectorBody"></div></aside>
</div>
<dialog id="dialog"><form id="dialogForm"><div class="dialog-heading"><h2 id="dialogTitle"></h2><button type="button" id="closeDialog" aria-label="关闭">×</button></div><div id="dialogBody"></div><div id="dialogFooter" class="dialog-footer"></div></form></dialog>
<div id="toast" role="status"></div>
<input id="fileInput" type="file" hidden>
<link rel="stylesheet" href="/fixes.css?v=frame-count-v2"><script src="/app.js?v=frame-count-v2" defer></script><script src="/graph.js?v=frame-count-v2" defer></script><script src="/images.js?v=frame-count-v2" defer></script><script src="/remix.js?v=frame-count-v2" defer></script><script src="/frames.js?v=frame-count-v2" defer></script><script src="/multi-batch.js?v=frame-count-v2" defer></script><script src="/module-actions.js?v=frame-count-v2" defer></script><script src="/selection.js?v=frame-count-v2" defer></script><script src="/project-menu.js?v=frame-count-v2" defer></script><script src="/devlog.js?v=frame-count-v2" defer></script><script src="/playback.js?v=frame-count-v2" defer></script><script src="/quality.js?v=frame-count-v2" defer></script><script src="/exports.js?v=frame-count-v2" defer></script></body></html>
